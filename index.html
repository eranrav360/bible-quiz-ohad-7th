<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שמואל א׳ – תרגול למבחן</title>
<meta name="description" content="תרגול למבחן בתנ״ך: שמואל א׳ פרק א׳ ופרק ב׳ פסוקים י״א–ל״ו. שאלות מגוונות עם משוב והסברים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4eee2; --surface:#fffdf8; --surface-2:#f3ead8; --ink:#1c2640; --muted:#636b7c; --line:#e3d7c0;
  --primary:#23507a; --primary-ink:#ffffff; --primary-soft:#e1ebf5;
  --accent:#c2742a; --accent-ink:#8a4b12; --accent-soft:#f6e4cc;
  --ok:#2b7a4b; --ok-soft:#ddf1e4; --bad:#b5392d; --bad-soft:#f8dfda; --warn:#9a6200; --warn-soft:#fbeed2;
  --verse:#3a2d1b;
  --shadow:0 1px 2px rgba(50,35,10,.06),0 8px 24px rgba(50,35,10,.08);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161b; --surface:#1d2129; --surface-2:#262b35; --ink:#ece6d9; --muted:#a2a8b5; --line:#343a48;
    --primary:#86b6e2; --primary-ink:#0d1a27; --primary-soft:#1f3347;
    --accent:#e3a660; --accent-ink:#f0c58f; --accent-soft:#3a2b18;
    --ok:#6fcb95; --ok-soft:#173026; --bad:#f08b7f; --bad-soft:#3b1e1b; --warn:#e8b95c; --warn-soft:#352a13;
    --verse:#efe2c6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Arial Hebrew',Arial,sans-serif;font-size:17px;line-height:1.55}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 72px}
.v{font-family:'Frank Ruhl Libre','David','Times New Roman',serif;font-size:1.1em;font-weight:500}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 24px 24px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--accent),var(--primary))}
.kicker{font-size:.85rem;font-weight:600;letter-spacing:.02em;color:var(--accent-ink)}
.hero h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(2rem,6vw,2.8rem);line-height:1.15;margin:6px 0 8px}
.hero p{margin:0;color:var(--muted)}
.scope{margin-top:18px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r)}
.scope h2{font-size:1rem;margin:0 0 8px}
.scope ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.scope li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.9rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 26px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;padding:16px 18px;border-radius:var(--r);border:0;background:var(--primary);color:var(--primary-ink);box-shadow:var(--shadow);transition:transform .15s}
.mode.alt{background:var(--surface);color:var(--ink);border:2px solid var(--primary)}
.mode:hover{transform:translateY(-2px)}
.mode b{font-size:1.15rem}
.mode span{font-size:.9rem;opacity:.85}
.h-sec{font-size:1.05rem;margin:0 0 10px;color:var(--muted);font-weight:600}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.sec{display:flex;gap:12px;align-items:flex-start;text-align:right;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,transform .15s}
.sec:hover{border-color:var(--accent);transform:translateY(-2px)}
.letter{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.3rem}
.sec .t{font-weight:600;line-height:1.3}
.sec .m{font-size:.84rem;color:var(--muted);margin-top:2px}
.sec .last{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.tip{margin-top:24px;font-size:.9rem;color:var(--muted);text-align:center}

/* ---------- quiz ---------- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.link{background:none;border:0;color:var(--primary);font-weight:600;padding:6px 0}
.qcount{font-size:.9rem;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .4s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow);animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.secname{font-size:.82rem;color:var(--muted)}
.prompt{font-size:1.22rem;font-weight:600;line-height:1.5;margin:14px 0 10px}
.verse{margin:0 0 14px;font-family:'Frank Ruhl Libre','David',serif;font-size:1.28rem;line-height:1.95;color:var(--verse);background:var(--surface-2);border-right:4px solid var(--accent);padding:12px 16px;border-radius:10px}
.verse cite{display:block;font-family:'Rubik',sans-serif;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.4}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.qbody{margin-top:6px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:13px 16px;border:2px solid var(--line);background:var(--surface);border-radius:12px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt.dim{opacity:.55}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.sel .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.sel .box::after{content:"✓"}
.tag{margin-inline-start:auto;flex:none;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid currentColor}
.statement{font-size:1.15rem;font-weight:500;padding:14px 16px;border-radius:12px;background:var(--surface-2);margin-bottom:14px;line-height:1.6}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;font-weight:600;font-size:1.08rem;padding:16px}
.tfi{font-size:1.2rem}

.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:10px 12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mhead{font-size:.8rem;font-weight:600;color:var(--muted)}
.mitem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;text-align:right;padding:10px 12px;min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:12px;line-height:1.35}
.mitem:hover:not(:disabled){border-color:var(--primary)}
.mitem.active{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.mitem:disabled{cursor:default}
.mtxt{flex:1;min-width:0}
.badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.82rem;font-weight:700;border:2px dashed var(--line);color:var(--muted);background:transparent}
.term .badge{border-style:solid}
.paired .badge{color:#fff;border-style:solid}
.mitem.ok{border-color:var(--ok);background:var(--ok-soft)}
.mitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.fixline{flex-basis:100%;font-size:.86rem;font-weight:600;color:var(--ok)}

.olist{display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;flex-wrap:wrap;align-items:center;gap:10px;text-align:right;padding:11px 14px;border:2px solid var(--line);background:var(--surface);border-radius:12px}
.oitem:hover:not(:disabled){border-color:var(--primary)}
.oitem.picked{border-color:var(--primary);background:var(--primary-soft)}
.oitem.picked .badge{background:var(--primary);border-color:var(--primary);border-style:solid;color:var(--primary-ink)}
.oitem.ok{border-color:var(--ok);background:var(--ok-soft)}
.oitem.ok .badge{background:var(--ok);border-color:var(--ok)}
.oitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.oitem.bad .badge{background:var(--bad);border-color:var(--bad)}
.oitem.ok .badge,.oitem.bad .badge{color:#fff;border-style:solid}
.oitem:disabled{cursor:default}
.otxt{flex:1;min-width:0}
.subactions{margin-top:10px}

.fill{line-height:2.6}
select.blank{font-family:inherit;font-size:.92em;padding:2px 6px;margin:0 3px;border-radius:8px;border:2px solid var(--primary);background:var(--surface);color:var(--ink);max-width:100%}
select.blank:disabled{opacity:1}
select.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
select.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.fix{color:var(--ok);font-weight:700;font-family:'Rubik',sans-serif;font-size:.85em}
.fix.miss{color:var(--warn)}

.slist,.wlist{display:flex;flex-direction:column;gap:8px}
.srow,.wq{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border:2px solid var(--line);background:var(--surface);border-radius:12px}
.srow.ok,.wq.ok{border-color:var(--ok);background:var(--ok-soft)}
.srow.bad,.wq.bad{border-color:var(--bad);background:var(--bad-soft)}
.stxt,.wtxt{flex:1 1 220px;min-width:0}
.wtxt{font-family:'Frank Ruhl Libre',serif;font-size:1.15rem;color:var(--verse)}
.seg{display:inline-flex;border:2px solid var(--primary);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:7px 14px;border:0;background:transparent;font-weight:500;font-size:.92rem}
.seg button+button{border-inline-start:2px solid var(--primary)}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.seg button:disabled{cursor:default}

.errtext{font-size:1.12rem;line-height:2.3;padding:12px 16px;background:var(--surface-2);border-radius:12px}
.tok{background:none;border:0;padding:1px 3px;margin:0 -1px;border-radius:6px;line-height:1.6;border-bottom:2px dotted var(--line)}
.tok:hover:not(:disabled){background:var(--primary-soft)}
.tok:disabled{cursor:default;border-bottom-color:transparent}
.tok.marked{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-bottom-color:transparent}
.tok.found{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.tok.missed{background:var(--warn-soft);color:var(--warn);text-decoration:line-through;outline:2px dashed var(--warn)}
.tok.wrongmark{background:var(--bad-soft);color:var(--bad);text-decoration:none;outline:2px solid var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:4px}

.ta{width:100%;min-height:120px;resize:vertical;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.6}
.ta:focus{outline:none;border-color:var(--primary)}
.pts{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--primary-soft);border:2px solid var(--primary)}
.pts-h{font-weight:700;margin-bottom:8px}
.pt{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--primary) 25%,transparent);cursor:pointer}
.pt:first-of-type{border-top:0}
.pt input{flex:none;width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}

.fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:2px solid;animation:in .25s ease}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.part{border-color:var(--warn);background:var(--warn-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fbh{font-weight:700;font-size:1.08rem}
.fb.ok .fbh{color:var(--ok)} .fb.part .fbh{color:var(--warn)} .fb.bad .fbh{color:var(--bad)}
.ex{margin:6px 0 0}
.ref{margin-top:6px;font-size:.84rem;color:var(--muted)}
.corder ol{margin:4px 0 0;padding-inline-start:22px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px}
.btn{font-weight:600;padding:12px 26px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none}
.btn.small{padding:6px 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.nudge{color:var(--bad);font-size:.92rem;font-weight:500}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* ---------- end ---------- */
.endhead{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.ring{flex:none;position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:700}
.endmsg h2{margin:0 0 4px;font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:1.7rem;line-height:1.2}
.endmsg p{margin:0;color:var(--muted)}
.bk{margin-top:20px}
.bk h3,.mist h3{font-size:1rem;margin:0 0 8px}
.bkrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;align-items:center;gap:10px;padding:5px 0;font-size:.92rem}
.bkbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bkbar span{display:block;height:100%;border-radius:99px}
.bkrow b{text-align:left;font-variant-numeric:tabular-nums}
.mist{margin-top:22px}
.mitem2{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--surface-2)}
.mitem2 .mq{font-weight:600}
.mitem2 .mx{font-size:.92rem;color:var(--muted);margin-top:4px}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:560px){
  body{font-size:16px}
  .card{padding:18px 14px;border-radius:16px}
  .hero{padding:24px 18px 20px}
  .modes{grid-template-columns:1fr}
  .match{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px}
  .mitem{padding:8px 9px;gap:6px;font-size:.93rem}
  .badge{width:24px;height:24px}
  .verse{font-size:1.18rem}
  .bkrow{grid-template-columns:minmax(0,1fr) 70px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';

/* =====================================================================
   תוכן השאלות
   t: סוג השאלה | q: השאלה | v: פסוק לתצוגה | vr: מקור הפסוק
   ex: הסבר אחרי הבדיקה | ref: מקור
   ב-mc האפשרות הראשונה היא הנכונה (הסדר מעורבב בתצוגה)
   ב-fill: מערך = מקום ריק, האפשרות הראשונה נכונה
   ב-error: {שגוי|נכון}
   ===================================================================== */
var SECTIONS = [
{
  id:'a', letter:'א', title:'רקע ומשפחת אלקנה', range:'פרק א׳, פסוקים א׳–ח׳',
  qs:[
    {t:'mc', q:'באיזו תקופה מתרחש הסיפור?',
     o:['בסוף תקופת השופטים – המאה ה־11 לפני הספירה','בימי דוד המלך','בזמן יציאת מצרים','בימי בית המקדש השני'],
     ex:'הסיפור מתחיל בסיומה של תקופת השופטים, במאה ה־11 לפני הספירה – תקופה שבה עוד לא היה מלך בישראל.'},
    {t:'mc', q:'מה מתאר הפסוק הזה על התקופה?',
     v:'בַּיָּמִים הָהֵם אֵין מֶלֶךְ בְּיִשְׂרָאֵל, אִישׁ הַיָּשָׁר בְּעֵינָיו יַעֲשֶׂה', vr:'שופטים כ״א, כ״ה',
     o:['לא הייתה הנהגה מרכזית, וכל אחד עשה מה שנראה לו','כל העם היה ישר וצדיק','המלך שלט ביד קשה בעם','העם בחר מלך חדש בכל שנה'],
     ex:'בלי מלך ובלי הנהגה חזקה, כל אחד עשה "הישר בעיניו" – מה שהוא חשב לנכון. זה הרקע לשחיתות שנראה בהמשך אצל בני עלי.'},
    {t:'mc', q:'מאיפה היה אלקנה?',
     o:['מהר אפרים','מירושלים','מבית לחם שבהר יהודה','מהגליל'],
     ex:'"וַיְהִי אִישׁ אֶחָד מִן הָרָמָתַיִם צוֹפִים מֵהַר אֶפְרָיִם, וּשְׁמוֹ אֶלְקָנָה" (בהמשך העיר נקראת "הרמה").', ref:'פרק א׳, פסוק א׳'},
    {t:'mc', q:'הפסוק מונה הרבה דורות של אבות אלקנה: "בֶּן יְרֹחָם בֶּן אֱלִיהוּא בֶּן תֹּחוּ בֶן צוּף". מה זה מלמד?',
     o:['שאלקנה היה ממשפחה מוכרת ומכובדת','שכל האבות שלו היו כהנים בשילה','שאלקנה היה זקן מאוד','שאלקנה היה מלך'],
     ex:'כשהמקרא מזכיר דורות רבים בהצגת שם, זה מצביע על כך שהאדם הוא ממשפחה מוכרת ומכובדת – "יחוס מרשים".', ref:'פרק א׳, פסוק א׳'},
    {t:'tf', s:'לפנינה היו ילדים, ולחנה לא היו ילדים.', a:true,
     ex:'"וַיְהִי לִפְנִנָּה יְלָדִים וּלְחַנָּה אֵין יְלָדִים". בעובדה הזו מגולם המתח המשפחתי והכאב הגדול שממנו נולד כל הסיפור.', ref:'פרק א׳, פסוק ב׳'},
    {t:'mc', q:'מה פירוש "מִיָּמִים יָמִימָה"?',

var app = document.getElementById('app');
function h(tag, attrs){
  var e = document.createElement(tag), k, v, i;
  if (attrs) for (k in attrs){ v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v); }
  for (i = 2; i < arguments.length; i++) add(e, arguments[i]);
  return e;
}
function add(e, kid){
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ add(e, k); }); return; }
  e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
var NIK = /[֑-ׇ]/;
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){
  var found = false;
  var out = esc(s).replace(/"([^"]+)"/g, function(m, inner){
    if (NIK.test(inner)) { found = true; return '<span class="v">"' + inner + '"</span>'; }
    return m;
  });
  if (!found && NIK.test(s)) out = '<span class="v">' + out + '</span>';
  return out;
}
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function lis(a){ var t = []; a.forEach(function(x){ var lo = 0, hi = t.length; while (lo < hi){ var m = (lo + hi) >> 1; if (t[m] < x) lo = m + 1; else hi = m; } t[lo] = x; }); return t.length; }

R.match = function(q, box){

  var tB = terms.map(function(o, k){ return h('button', {class:'mitem term', type:'button', onclick:function(){ clickT(k); }}, h('span', {class:'badge'}, String(k + 1)), h('span', {class:'mtxt', html:fmt(o.t)})); });
  var mB = means.map(function(o, k){ return h('button', {class:'mitem mean', type:'button', onclick:function(){ clickM(k); }}, h('span', {class:'badge'}), h('span', {class:'mtxt', html:fmt(o.t)})); });
  function owner(m){ return tm.indexOf(m); }
  function pair(t, m){ var ow = owner(m); if (ow >= 0) tm[ow] = -1; tm[t] = m; }
  function clickT(k){
    if (locked) return;
    if (tm[k] >= 0) { tm[k] = -1; act = null; return paint(); }
    if (act && act.s === 'm') { pair(k, act.k); act = null; }
    else act = (act && act.s === 't' && act.k === k) ? null : {s:'t', k:k};

  }
  function clickM(m){
    if (locked) return;
    var ow = owner(m);
    if (ow >= 0) { tm[ow] = -1; act = null; return paint(); }
    if (act && act.s === 't') { pair(act.k, m); act = null; }

    });
    mB.forEach(function(b, m){
      var ow = owner(m), bd = b.querySelector('.badge');
      b.classList.toggle('active', !!act && act.s === 'm' && act.k === m);
      b.classList.toggle('paired', ow >= 0);
      bd.textContent = ow >= 0 ? String(ow + 1) : '';

  return { check:function(){

function parseErr(text){
  var toks = [], re = /\{([^|}]+)\|([^}]+)\}([.,:;!?]*)|(\S+)/g, m;
  while ((m = re.exec(text))) {
    if (m[4] !== undefined) toks.push({w:m[4]});
    else toks.push({w:m[1], fix:m[2], err:true, punct:m[3]});
  }
  return toks;
}

  var spans = toks.map(function(t, k){
    var b = h('button', {class:'tok', type:'button', onclick:function(){ if (locked) return; marked[k] = !marked[k]; b.classList.toggle('marked', !!marked[k]); }}, t.w);
    p.append(b); if (t.punct) p.append(t.punct); p.append(' ');
    return b;
  });
  box.append(p);
  return { check:function(){
    var any = Object.keys(marked).some(function(k){ return marked[k]; });
    if (!any) return null;
    locked = true;
    var nErr = 0, found = 0, wrong = 0;
    toks.forEach(function(t, k){
      var b = spans[k]; b.disabled = true; b.classList.remove('marked');
      if (t.err) nErr++;
      if (t.err && marked[k]) { b.classList.add('found'); found++; b.after(h('span', {class:'fix'}, ' (' + t.fix + ')')); }
      else if (t.err) { b.classList.add('missed'); b.after(h('span', {class:'fix miss'}, ' (' + t.fix + ')')); }
      else if (marked[k]) { b.classList.add('wrongmark'); wrong++; }
    });
    box.append(h('div', {class:'legend'},
      h('span', null, h('i', {style:'background:var(--ok-soft);outline:2px solid var(--ok)'}), 'מצאת'),
      h('span', null, h('i', {style:'background:var(--warn-soft);outline:2px dashed var(--warn)'}), 'פספסת'),
      wrong ? h('span', null, h('i', {style:'background:var(--bad-soft);outline:2px solid var(--bad)'}), 'סימנת – אבל זה היה נכון') : null));
    return Math.max(0, (found - wrong) / nErr);
  }};
};

R.open = function(q, box){
  var ta = h('textarea', {class:'ta', rows:'5', placeholder:'כתוב כאן את התשובה שלך (או במחברת)...'});
  box.append(ta);
  var cbs = [];
  return {
    open:true,
    check:function(){
      ta.readOnly = true;
      var list = h('div', {class:'pts'}, h('div', {class:'pts-h'}, 'תשובה טובה צריכה לכלול – סמן ✓ ליד כל נקודה שכתבת או ידעת:'),
        q.pts.map(function(pt){ var cb = h('input', {type:'checkbox'}); cbs.push(cb); return h('label', {class:'pt'}, cb, h('span', {html:fmt(pt)})); }));
      box.append(list);
      return -1;
    },
    finalize:function(){ return cbs.filter(function(c){ return c.checked; }).length / cbs.length; }
  };
};

/* ===================== screens ===================== */
var S = null;

function renderHome(){
  S = null;
  app.innerHTML = '';
  var store = loadStore();
  var total = allItems().length;
  var hero = h('section', {class:'hero'},
    h('div', {class:'kicker'}, 'תנ״ך · כיתה ז׳ · הכנה למבחן'),
    h('h1', null, 'שמואל א׳, פרקים א׳–ב׳'),
    h('p', null, 'פרק א׳ במלואו, ופרק ב׳ מפסוק י״א ועד סוף הפרק. ' + total + ' שאלות בעשרה סוגים שונים – עם הסבר אחרי כל תשובה.'),
    h('div', {class:'scope'}, h('h2', null, 'הנושאים שהמורה ביקשה להתמקד בהם'),
      h('ul', null, TOPICS.map(function(t){ return h('li', null, t); }))));
  var modes = h('div', {class:'modes'},
    h('button', {class:'mode', type:'button', onclick:function(){
      var pool = shuffle(allItems().filter(function(it){ return it.q.t !== 'open'; })).slice(0, 20);
      startSession(pool, 'מבחן מהיר');
    }}, h('b', null, 'מבחן מהיר'), h('span', null, '20 שאלות אקראיות מכל החומר')),
    h('button', {class:'mode alt', type:'button', onclick:function(){ startSession(allItems(), 'כל השאלות'); }},
      h('b', null, 'כל השאלות'), h('span', null, total + ' שאלות, לפי סדר הנושאים')));
  var grid = h('div', {class:'secs'}, SECTIONS.map(function(s){
    var last = store[s.id];
    return h('button', {class:'sec', type:'button', onclick:function(){
      startSession(s.qs.map(function(q){ return {sec:s, q:q}; }), s.title);
    }}, h('span', {class:'letter'}, s.letter),
      h('span', null, h('div', {class:'t'}, s.title), h('div', {class:'m', html:fmt(s.range) + ' · ' + s.qs.length + ' שאלות'}),
        last != null ? h('span', {class:'last'}, 'בפעם הקודמת: ' + last + '%') : null));
  }));
  app.append(hero, modes, h('h2', {class:'h-sec'}, 'או תרגל לפי נושא:'), grid,
    h('p', {class:'tip'}, 'טיפ: לפני התרגול כדאי לקרוא שוב את הפרקים מהספר ואת הסיכומים במחברת. בהצלחה במבחן!'));
  window.scrollTo(0, 0);
}

function startSession(list, title){ S = {list:list, i:0, res:[], title:title}; renderQ(); }

function renderQ(){
  var it = S.list[S.i], q = it.q, sec = it.sec;
  app.innerHTML = '';
  var top = h('div', {class:'qtop'},
    h('button', {class:'link', type:'button', onclick:renderHome}, '→ לתפריט'),
    h('div', {class:'qcount'}, 'שאלה ' + (S.i + 1) + ' מתוך ' + S.list.length));
  var bar = h('div', {class:'bar'}, h('span', {style:'width:' + (S.i / S.list.length * 100) + '%'}));
  var card = h('article', {class:'card'});
  var tp = TYPE[q.t];
  card.append(h('div', {class:'qmeta'}, h('span', {class:'chip'}, tp[0]), h('span', {class:'secname'}, sec.letter + '. ' + sec.title)));
  card.append(h('h2', {class:'prompt', html:fmt(q.q || 'האם המשפט הבא נכון?')}));
  if (q.v) card.append(h('blockquote', {class:'verse', html:esc(q.v) + (q.vr ? '<cite>(' + esc(q.vr) + ')</cite>' : '')}));
  var hint = tp[1];
  if (q.t === 'error') hint = 'בקטע מסתתרות ' + parseErr(q.text).filter(function(t){ return t.err; }).length + ' טעויות. לחץ על כל מילה שגויה (לחיצה נוספת מבטלת).';
  if (hint) card.append(h('p', {class:'hint'}, hint));
  var body = h('div', {class:'qbody'}); card.append(body);
  var api = R[q.t](q, body);
  var fb = h('div', {'aria-live':'polite'});
  var nudge = h('span', {class:'nudge', role:'status'});
  var last = S.i === S.list.length - 1;
  var btn = h('button', {class:'btn', type:'button'}, q.t === 'open' ? 'הצג תשובה' : 'בדיקה');
  card.append(fb, h('div', {class:'actions'}, btn, nudge));
  var stage = 0, score = 0;
  btn.addEventListener('click', function(){
    if (stage === 0) {
      var r = api.check();
      if (r === null) { nudge.textContent = NUDGE[q.t]; nudge.classList.remove('shake'); void nudge.offsetWidth; nudge.classList.add('shake'); return; }
      nudge.textContent = ''; stage = 1;
      if (!api.open) { score = r; fb.append(feedback(q, r, api)); }
      btn.textContent = last ? 'לסיכום' : 'לשאלה הבאה ←';
      btn.focus({preventScroll:true});
      fb.scrollIntoView({behavior:'smooth', block:'nearest'});
    } else {
      if (api.open) score = api.finalize();
      S.res.push({sec:sec, q:q, score:score});
      S.i++;
      if (S.i >= S.list.length) renderEnd(); else renderQ();
    }
  });
  app.append(top, bar, card);
  window.scrollTo(0, 0);
}

function feedback(q, r, api){
  var cls, head;
  if (r >= 0.999) { cls = 'ok'; head = pick(PRAISE); }
  else if (r > 0) { cls = 'part'; head = 'חלקית נכון (' + Math.round(r * 100) + '%)'; }
  else { cls = 'bad'; head = pick(OOPS); }
  var box = h('div', {class:'fb ' + cls}, h('div', {class:'fbh'}, head));
  if (api.detail && r < 0.999) box.append(h('div', {html:api.detail()}));
  if (q.ex) box.append(h('p', {class:'ex', html:fmt(q.ex)}));
  if (q.ref) box.append(h('div', {class:'ref'}, 'מקור: ' + q.ref));
  return box;
}

function avg(list){ return list.length ? Math.round(list.reduce(function(a, r){ return a + r.score; }, 0) / list.length * 100) : null; }

function renderEnd(){
  app.innerHTML = '';
  var auto = S.res.filter(function(r){ return r.q.t !== 'open'; });
  var open = S.res.filter(function(r){ return r.q.t === 'open'; });
  var pct = avg(auto), openPct = avg(open);
  var main = pct != null ? pct : openPct;

  // remember per-section result
  var store = loadStore();
  SECTIONS.forEach(function(s){
    var rs = S.res.filter(function(r){ return r.sec === s; });
    if (rs.length === s.qs.length) store[s.id] = avg(rs);
  });
  saveStore(store);

  var msg = main >= 90 ? ['מצוין!', 'אתה שולט בחומר – אתה מוכן למבחן.']
          : main >= 75 ? ['יפה מאוד!', 'עוד קצת חזרה על מה שטעית בו, ואתה שם.']
          : main >= 55 ? ['בדרך הנכונה', 'כדאי לחזור על הנושאים שטעית בהם ולנסות שוב.']
          : ['כדאי לחזור על החומר', 'קרא שוב את הפרקים והסיכומים, ואז נסה שוב – זה ישתפר.'];
  var C = 2 * Math.PI * 54, off = C * (1 - main / 100);
  var ring = h('div', {class:'ring', html:
    '<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="12"/>' +
    '<circle cx="60" cy="60" r="54" fill="none" stroke="' + pctColor(main) + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>' +
    '<div class="num">' + main + '%</div>'});
  var sub = [];
  if (pct != null) sub.push('ציון בשאלות הסגורות: ' + pct + '% (' + auto.length + ' שאלות)');
  if (openPct != null) sub.push('שאלות פתוחות (בדיקה עצמית): ' + openPct + '% מנקודות המפתח');
  var card = h('article', {class:'card'},
    h('div', {class:'endhead'}, ring, h('div', {class:'endmsg'}, h('h2', null, msg[0]), h('p', null, msg[1]),
      h('p', {style:'margin-top:6px;font-size:.88rem'}, sub.join(' · ')))));

  // breakdown by section
  var secs = SECTIONS.filter(function(s){ return S.res.some(function(r){ return r.sec === s; }); });
  if (secs.length > 1) {
    card.append(h('div', {class:'bk'}, h('h3', null, 'לפי נושא'), secs.map(function(s){
      var p = avg(S.res.filter(function(r){ return r.sec === s; }));
      return h('div', {class:'bkrow'}, h('span', null, s.letter + '. ' + s.title),
        h('div', {class:'bkbar'}, h('span', {style:'width:' + p + '%;background:' + pctColor(p)})), h('b', null, p + '%'));
    })));
  }

  // mistakes
  var wrong = auto.filter(function(r){ return r.score < 0.999; });
  if (wrong.length) {
    card.append(h('div', {class:'mist'}, h('h3', null, 'כדאי לחזור על (' + wrong.length + '):'),
      wrong.map(function(r){
        var qt = r.q.q || r.q.s;
        return h('div', {class:'mitem2'}, h('div', {class:'mq', html:fmt(qt)}), r.q.ex ? h('div', {class:'mx', html:fmt(r.q.ex)}) : null);
      })));
  }

  var acts = h('div', {class:'actions'});
  if (wrong.length) acts.append(h('button', {class:'btn', type:'button', onclick:function(){
    startSession(shuffle(wrong.map(function(r){ return {sec:r.sec, q:r.q}; })), 'תרגול טעויות');
  }}, 'תרגל שוב את הטעויות'));
  var again = S.list.slice(), title = S.title;
  acts.append(h('button', {class:'btn ghost', type:'button', onclick:function(){ startSession(again, title); }}, 'שוב מההתחלה'));
  acts.append(h('button', {class:'btn ghost', type:'button', onclick:renderHome}, 'לתפריט'));
  card.append(acts);

  app.append(h('div', {class:'qtop'}, h('button', {class:'link', type:'button', onclick:renderHome}, '→ לתפריט'), h('div', {class:'qcount'}, 'סיכום')),
    h('div', {class:'bar'}, h('span', {style:'width:100%'})), card);
  window.scrollTo(0, 0);
  if (main >= 85) confetti();
}

function confetti(){
  try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(e){}
  var c = h('canvas', {class:'confetti'}); document.body.append(c);
  var d = window.devicePixelRatio || 1, ctx = c.getContext('2d');
  var W = c.width = innerWidth * d, H = c.height = innerHeight * d;
  var P = []; for (var i = 0; i < 140; i++) P.push({x:Math.random() * W, y:-Math.random() * H * .5, vx:(Math.random() - .5) * 4 * d, vy:(2 + Math.random() * 4) * d, r:(5 + Math.random() * 6) * d, c:pick(COLORS), a:Math.random() * 6, va:(Math.random() - .5) * .3});
  var t0 = performance.now();
  (function f(t){
    var el = t - t0; ctx.clearRect(0, 0, W, H);
    P.forEach(function(p){ p.x += p.vx; p.y += p.vy; p.vy += .05 * d; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - el / 3200); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (el < 3200) requestAnimationFrame(f); else c.remove();
  })(t0);
}

renderHome();
})();
</script>
</body>
